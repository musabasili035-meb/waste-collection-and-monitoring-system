<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoYunga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'shimmer': 'shimmer 8s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(2deg)' },
                        },
                        shimmer: {
                            '0%, 100%': { transform: 'translateX(-100%)' },
                            '50%': { transform: 'translateX(100%)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 20px rgba(16,185,129,0.3), 0 0 40px rgba(16,185,129,0.1)' },
                            '100%': { boxShadow: '0 0 30px rgba(16,185,129,0.5), 0 0 60px rgba(16,185,129,0.2)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .glass-dark {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .input-field {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-field:focus {
            transform: scale(1.02);
        }
        .btn-glow:hover {
            animation: glow 1s ease-in-out infinite alternate;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #059669, #10b981, #34d399, #a7f3d0, #059669);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            pointer-events: none;
        }
    </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Floating particles -->
    <div class="particle w-16 h-16 top-[10%] left-[5%] animate-float"></div>
    <div class="particle w-8 h-8 top-[20%] right-[10%] animate-float-delayed"></div>
    <div class="particle w-12 h-12 bottom-[15%] left-[8%] animate-float" style="animation-delay: 1.5s;"></div>
    <div class="particle w-6 h-6 bottom-[25%] right-[5%] animate-float-delayed"></div>
    <div class="particle w-10 h-10 top-[50%] left-[2%] animate-float" style="animation-delay: 4s;"></div>
    <div class="particle w-14 h-14 top-[5%] right-[15%] animate-float-delayed"></div>
    <div class="particle w-20 h-20 bottom-[5%] right-[20%] animate-float" style="animation-delay: 2s;"></div>

    <!-- Card -->
    <div class="w-full max-w-sm glass rounded-3xl shadow-2xl border border-white/30 overflow-hidden relative group animate-glow">

        <!-- Shimmer overlay on hover -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-700">
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1500" style="transition-duration: 1.5s;"></div>
        </div>

        <!-- Header -->
        <div class="px-6 pt-8 pb-6 text-center relative">
            <div class="w-14 h-14 mx-auto bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl flex items-center justify-center mb-3 shadow-lg shadow-green-500/30 transform group-hover:scale-110 group-hover:rotate-3 transition-all duration-500">
                <i class="fas fa-recycle text-xl text-white absolute"></i>
                <i class="fas fa-leaf text-[10px] text-green-200 absolute bottom-2 right-2.5"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">EcoYunga</h1>
            <p class="text-gray-500 text-xs mt-0.5">Smart Waste Management</p>
        </div>

        <!-- Form -->
        <div class="px-6 pb-8">
            {% if messages %}
            <div class="mb-4 space-y-1.5">
                {% for message in messages %}
                <div class="flex items-center gap-2 px-3 py-2.5 text-xs rounded-xl border backdrop-blur-sm
                    {% if message.tags == 'error' %}
                        bg-red-50/90 text-red-700 border-red-200/50
                    {% else %}
                        bg-green-50/90 text-green-700 border-green-200/50
                    {% endif %}">
                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %} text-xs"></i>
                    <span class="font-medium">{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="space-y-4" id="loginForm">
                {% csrf_token %}

                <div class="space-y-1">
                    <label for="username" class="text-xs font-semibold text-gray-600">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 transition-colors duration-300"><i class="fas fa-user text-xs"></i></span>
                        <input type="text" name="username" id="username" required autofocus
                            class="input-field w-full pl-9 pr-3.5 py-3 text-sm bg-white/50 border border-gray-200/50 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-green-400 focus:ring-2 focus:ring-green-400/30"
                            placeholder="Enter your username">
                    </div>
                </div>

                <div class="space-y-1">
                    <label for="password" class="text-xs font-semibold text-gray-600">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 transition-colors duration-300"><i class="fas fa-lock text-xs"></i></span>
                        <input type="password" name="password" id="password" required
                            class="input-field w-full pl-9 pr-10 py-3 text-sm bg-white/50 border border-gray-200/50 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-green-400 focus:ring-2 focus:ring-green-400/30"
                            placeholder="Enter your password">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                            <i class="fas fa-eye text-xs" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <div class="relative">
                            <input type="checkbox" class="sr-only peer">
                            <div class="w-8 h-4.5 bg-gray-200 rounded-full peer-checked:bg-green-500 transition-colors" style="height: 18px; width: 32px;"></div>
                            <div class="absolute top-0.5 left-0.5 w-3.5 h-3.5 bg-white rounded-full shadow peer-checked:translate-x-3.5 transition-transform"></div>
                        </div>
                        <span class="text-xs text-gray-500 group-hover:text-gray-700 transition-colors">Remember me</span>
                    </label>
                    <a href="#" class="text-xs font-medium text-green-600 hover:text-green-700 transition-colors">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn"
                    class="btn-glow w-full flex items-center justify-center gap-2 py-3 text-sm font-semibold text-white bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl shadow-lg shadow-green-500/25 hover:shadow-green-500/40 hover:from-green-600 hover:to-emerald-700 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-offset-2 transition-all duration-300">
                    <span id="loginBtnText">Sign In</span>
                    <svg id="loginSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>

            <p class="text-center text-xs text-gray-400 mt-5">
                &copy; 2026 EcoYunga - Smart Waste Management System
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fas fa-eye-slash text-xs'; }
            else { pwd.type = 'password'; icon.className = 'fas fa-eye text-xs'; }
        }
        document.getElementById('loginForm').addEventListener('submit', function() {
            document.getElementById('loginBtnText').textContent = 'Signing in...';
            document.getElementById('loginSpinner').classList.remove('hidden');
        });
    </script>
</body>
</html>
